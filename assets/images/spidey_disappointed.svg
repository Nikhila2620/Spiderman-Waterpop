<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270">
  <defs>
    <filter id="webGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.6"/>
    </filter>
    <filter id="spideyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#050515" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sadAura" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sad Mild Aura -->
  <circle cx="100" cy="160" r="85" fill="url(#sadAura)"/>

  <!-- Web Anchor Thread from Top Screen Ceiling -->
  <g filter="url(#webGlow)">
    <line x1="100" y1="0" x2="100" y2="70" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="20" r="2" fill="#cbd5e1"/>
    <circle cx="100" cy="40" r="2" fill="#cbd5e1"/>
    <circle cx="100" cy="60" r="2" fill="#cbd5e1"/>
  </g>

  <!-- Upside Down Spider-Man Character (Dehydrated / Slumped) -->
  <g filter="url(#spideyShadow)">

    <!-- Inverted Feet Clinging Limply to Web -->
    <path d="M 100 68 C 92 64, 80 62, 74 74 C 70 86, 78 102, 86 112" fill="none" stroke="url(#suitBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 68 C 92 64, 84 62, 78 72" fill="none" stroke="url(#suitRed)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="98" cy="66" rx="6" ry="8" fill="url(#suitRed)" transform="rotate(-10 98 66)"/>

    <path d="M 100 68 C 108 64, 120 62, 126 74 C 130 86, 122 102, 114 112" fill="none" stroke="url(#suitBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 68 C 108 64, 116 62, 122 72" fill="none" stroke="url(#suitRed)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="102" cy="66" rx="6" ry="8" fill="url(#suitRed)" transform="rotate(10 102 66)"/>

    <!-- Inverted Torso / Hips -->
    <path d="M 84 110 Q 100 104 116 110 L 112 148 Q 100 152 88 148 Z" fill="url(#suitBlue)"/>
    <path d="M 88 112 Q 100 108 112 112 L 110 148 Q 100 151 90 148 Z" fill="url(#suitRed)"/>

    <!-- Web Lines -->
    <path d="M 90 120 Q 100 124 110 120" stroke="#881337" stroke-width="1.2" fill="none"/>
    <path d="M 90 132 Q 100 136 110 132" stroke="#881337" stroke-width="1.2" fill="none"/>
    <line x1="100" y1="110" x2="100" y2="148" stroke="#881337" stroke-width="1.2"/>

    <!-- Emblem -->
    <ellipse cx="100" cy="130" rx="3" ry="4.5" fill="#09090b"/>

    <!-- Both Arms Hanging Limply Downward -->
    <path d="M 84 116 C 70 126, 68 148, 70 168" fill="none" stroke="url(#suitRed)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 116 116 C 130 126, 132 148, 130 168" fill="none" stroke="url(#suitRed)" stroke-width="9" stroke-linecap="round"/>

    <!-- Head (Slumped with sad drooping lenses) -->
    <g transform="translate(100, 196)">
      <ellipse cx="0" cy="0" rx="28" ry="32" fill="url(#suitRed)"/>

      <!-- Mask Web Lines -->
      <path d="M 0 -32 L 0 32" stroke="#881337" stroke-width="1.2"/>
      <path d="M -28 0 L 28 0" stroke="#881337" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="10" ry="12" fill="none" stroke="#881337" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="20" ry="24" fill="none" stroke="#881337" stroke-width="1.2"/>

      <!-- Sad Drooping / Half-Closed Lenses -->
      <!-- Left Sad Eye -->
      <path d="M -5 2 Q -18 10 -22 0 Q -14 -6 -4 -4 Z" fill="#ffffff" stroke="#09090b" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Right Sad Eye -->
      <path d="M 5 2 Q 18 10 22 0 Q 14 -6 4 -4 Z" fill="#ffffff" stroke="#09090b" stroke-width="3.5" stroke-linejoin="round"/>

      <line x1="-16" y1="-2" x2="-6" y2="-1" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="16" y1="-2" x2="6" y2="-1" stroke="#cbd5e1" stroke-width="2"/>

      <!-- Big Comedic Anime Sweat Drop (Blue) -->
      <g transform="translate(26, -18)">
        <path d="M 6 0 C 6 0, 12 9, 12 14 C 12 17.5, 9.3 20, 6 20 C 2.7 20, 0 17.5, 0 14 C 0 9, 6 0, 6 0 Z" fill="#38bdf8" opacity="0.95"/>
        <ellipse cx="4.5" cy="14" rx="1.5" ry="3" fill="#ffffff" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- Sad little clouds / question marks -->
  <text x="32" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#64748b">?</text>
  <text x="24" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#94a3b8">💧...</text>
</svg>
