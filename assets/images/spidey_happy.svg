<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270">
  <defs>
    <!-- Web Strand Glow -->
    <filter id="webGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#fbbf24" flood-opacity="0.8"/>
    </filter>
    <filter id="spideyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#050515" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="celebrationAura" cx="50%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Golden Warm Celebration Aura -->
  <circle cx="100" cy="160" r="95" fill="url(#celebrationAura)"/>

  <!-- Web Anchor Thread from Top Screen Ceiling -->
  <g filter="url(#webGlow)">
    <line x1="100" y1="0" x2="100" y2="70" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="18" r="2.5" fill="#ffffff"/>
    <circle cx="100" cy="38" r="2.5" fill="#ffffff"/>
    <circle cx="100" cy="58" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Stars & Confetti -->
  <!-- Top Right Star -->
  <path d="M 165 45 Q 165 55 175 55 Q 165 55 165 65 Q 165 55 155 55 Q 165 55 165 45 Z" fill="#fbbf24"/>
  <!-- Top Left Star -->
  <path d="M 35 60 Q 35 68 43 68 Q 35 68 35 76 Q 35 68 27 68 Q 35 68 35 60 Z" fill="#38bdf8"/>
  <!-- Bottom Left Star -->
  <path d="M 28 175 Q 28 183 36 183 Q 28 183 28 191 Q 28 183 20 183 Q 28 183 28 175 Z" fill="#fbbf24"/>
  <!-- Confetti drops -->
  <circle cx="170" cy="115" r="3.5" fill="#34d399"/>
  <circle cx="178" cy="165" r="3" fill="#f43f5e"/>
  <circle cx="26" cy="120" r="2.8" fill="#38bdf8"/>

  <!-- Upside Down Spider-Man Character (Celebrating!) -->
  <g filter="url(#spideyShadow)">

    <!-- Inverted Legs (Kicking up with joy) -->
    <path d="M 100 68 C 88 56, 68 62, 58 76 C 50 90, 68 108, 84 112" fill="none" stroke="url(#suitBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 68 C 90 58, 76 64, 66 76" fill="none" stroke="url(#suitRed)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="98" cy="66" rx="6" ry="8" fill="url(#suitRed)" transform="rotate(-25 98 66)"/>

    <path d="M 100 68 C 114 54, 136 60, 144 76 C 150 92, 134 108, 116 114" fill="none" stroke="url(#suitBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 68 C 112 56, 126 62, 134 76" fill="none" stroke="url(#suitRed)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="102" cy="66" rx="6" ry="8" fill="url(#suitRed)" transform="rotate(25 102 66)"/>

    <!-- Inverted Torso / Hips -->
    <path d="M 82 110 Q 100 102 118 110 L 114 148 Q 100 152 86 148 Z" fill="url(#suitBlue)"/>
    <path d="M 88 112 Q 100 106 112 112 L 110 148 Q 100 151 90 148 Z" fill="url(#suitRed)"/>
    <!-- Web Lines -->
    <path d="M 90 120 Q 100 124 110 120" stroke="#881337" stroke-width="1.2" fill="none"/>
    <path d="M 90 132 Q 100 136 110 132" stroke="#881337" stroke-width="1.2" fill="none"/>
    <line x1="100" y1="110" x2="100" y2="148" stroke="#881337" stroke-width="1.2"/>

    <!-- Emblem -->
    <ellipse cx="100" cy="130" rx="3" ry="4.5" fill="#09090b"/>

    <!-- Left Arm: Thwip Web Shoot Gesture! -->
    <path d="M 84 116 C 64 120, 52 136, 44 148" fill="none" stroke="url(#suitRed)" stroke-width="9" stroke-linecap="round"/>
    <!-- Web blast from left wrist -->
    <g transform="translate(42, 150)">
      <circle cx="0" cy="0" r="5" fill="#fbbf24"/>
      <line x1="0" y1="0" x2="-14" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-18" y2="-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-10" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Right Arm: Big Victory Thumbs-Up! -->
    <path d="M 116 116 C 138 120, 150 136, 156 146" fill="none" stroke="url(#suitRed)" stroke-width="9" stroke-linecap="round"/>
    <!-- Thumbs up fist -->
    <g transform="translate(156, 146)">
      <!-- Thumb pointing up/diagonal -->
      <path d="M 2 -2 C 2 -8, 8 -8, 8 -2 L 8 4 L 2 4 Z" fill="#e11d48"/>
      <rect x="0" y="2" width="12" height="12" rx="4" fill="#be123c"/>
      <!-- Sparkle on thumb -->
      <path d="M 6 -8 Q 6 -4 10 -4 Q 6 -4 6 0 Q 6 -4 2 -4 Q 6 -4 6 -8 Z" fill="#ffffff"/>
    </g>

    <!-- Head (Smiling Happy Eyes!) -->
    <g transform="translate(100, 195)">
      <ellipse cx="0" cy="0" rx="28" ry="32" fill="url(#suitRed)"/>

      <!-- Mask Web Lines -->
      <path d="M 0 -32 L 0 32" stroke="#881337" stroke-width="1.2"/>
      <path d="M -28 0 L 28 0" stroke="#881337" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="10" ry="12" fill="none" stroke="#881337" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="20" ry="24" fill="none" stroke="#881337" stroke-width="1.2"/>

      <!-- Happy Inverted Crescent Eyes (Smiling big!) -->
      <!-- Left Smiling Eye -->
      <path d="M -4 4 C -8 16, -20 16, -22 6 C -18 0, -8 0, -4 4 Z" fill="#ffffff" stroke="#09090b" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Right Smiling Eye -->
      <path d="M 4 4 C 8 16, 20 16, 22 6 C 18 0, 8 0, 4 4 Z" fill="#ffffff" stroke="#09090b" stroke-width="3.5" stroke-linejoin="round"/>

      <ellipse cx="-13" cy="7" rx="3" ry="2" fill="#38bdf8" opacity="0.4"/>
      <ellipse cx="13" cy="7" rx="3" ry="2" fill="#38bdf8" opacity="0.4"/>
    </g>
  </g>
</svg>
