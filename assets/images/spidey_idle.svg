<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270">
  <defs>
    <!-- Web Strand Glow -->
    <filter id="webGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
    <!-- Spidey Soft Drop Shadow -->
    <filter id="spideyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#050515" flood-opacity="0.45"/>
    </filter>
    <!-- Suit Red Gradient -->
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <!-- Suit Blue Gradient -->
    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Cozy Warm Aura Glow -->
    <radialGradient id="cozyAura" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Flask Gradient -->
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Cozy Ambient Glow -->
  <circle cx="100" cy="160" r="85" fill="url(#cozyAura)"/>

  <!-- Web Anchor Thread from Top Screen Ceiling -->
  <g filter="url(#webGlow)">
    <line x1="100" y1="0" x2="100" y2="70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Web Silk Nodes -->
    <circle cx="100" cy="18" r="2" fill="#ffffff"/>
    <circle cx="100" cy="38" r="2" fill="#ffffff"/>
    <circle cx="100" cy="58" r="2" fill="#ffffff"/>
  </g>

  <!-- Upside Down Spider-Man Character -->
  <g filter="url(#spideyShadow)">

    <!-- Inverted Feet Clinging to Web Thread -->
    <!-- Left Leg (bent in upside-down spider hang) -->
    <path d="M 100 68 C 90 62, 75 58, 68 70 C 62 82, 72 100, 84 112" fill="none" stroke="url(#suitBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 68 C 92 63, 80 60, 72 70" fill="none" stroke="url(#suitRed)" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Boot -->
    <ellipse cx="98" cy="66" rx="6" ry="8" fill="url(#suitRed)" transform="rotate(-15 98 66)"/>

    <!-- Right Leg (bent outward) -->
    <path d="M 100 68 C 112 60, 128 62, 134 76 C 140 90, 128 106, 116 114" fill="none" stroke="url(#suitBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 68 C 110 61, 122 64, 128 74" fill="none" stroke="url(#suitRed)" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Boot -->
    <ellipse cx="102" cy="66" rx="6" ry="8" fill="url(#suitRed)" transform="rotate(15 102 66)"/>

    <!-- Inverted Torso / Hips -->
    <path d="M 82 110 Q 100 102 118 110 L 114 148 Q 100 152 86 148 Z" fill="url(#suitBlue)"/>
    <!-- Chest / Abdomen (Red Center Vest) -->
    <path d="M 88 112 Q 100 106 112 112 L 110 148 Q 100 151 90 148 Z" fill="url(#suitRed)"/>
    <!-- Subtle Web Lines on Suit -->
    <path d="M 90 120 Q 100 124 110 120" stroke="#881337" stroke-width="1.2" fill="none"/>
    <path d="M 90 132 Q 100 136 110 132" stroke="#881337" stroke-width="1.2" fill="none"/>
    <line x1="100" y1="110" x2="100" y2="148" stroke="#881337" stroke-width="1.2"/>

    <!-- Black Spider Chest Emblem (Inverted) -->
    <ellipse cx="100" cy="130" rx="3" ry="4.5" fill="#09090b"/>
    <path d="M 100 128 Q 94 124 93 120 M 100 130 Q 93 130 91 128 M 100 131 Q 93 134 92 138 M 100 132 Q 94 138 95 142" stroke="#09090b" stroke-width="1" fill="none"/>
    <path d="M 100 128 Q 106 124 107 120 M 100 130 Q 107 130 109 128 M 100 131 Q 107 134 108 138 M 100 132 Q 106 138 105 142" stroke="#09090b" stroke-width="1" fill="none"/>

    <!-- Left Arm holding the Web Line casually -->
    <path d="M 84 116 C 68 126, 62 100, 72 82 C 78 72, 92 70, 98 70" fill="none" stroke="url(#suitRed)" stroke-width="9" stroke-linecap="round"/>

    <!-- Right Arm holding Cozy Water Tumbler -->
    <path d="M 116 116 C 132 124, 140 140, 134 154 C 130 162, 122 162, 118 160" fill="none" stroke="url(#suitRed)" stroke-width="9" stroke-linecap="round"/>

    <!-- Cozy Water Tumbler (Flask with Water Drop Logo) -->
    <g transform="translate(112, 150)">
      <rect x="0" y="0" width="16" height="24" rx="4" fill="url(#flaskGrad)" stroke="#0284c7" stroke-width="1"/>
      <!-- Tumbler Cap -->
      <rect x="3" y="-5" width="10" height="5" rx="1.5" fill="#f8fafc"/>
      <!-- Straw -->
      <line x1="8" y1="-5" x2="8" y2="-12" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Water Drop Graphic on Bottle -->
      <path d="M 8 6 C 8 6, 12 11, 12 14 C 12 16.2, 10.2 18, 8 18 C 5.8 18, 4 16.2, 4 14 C 4 11, 8 6, 8 6 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Spider-Man Head (Hanging inverted, facing the viewer with friendly tilt) -->
    <g transform="translate(100, 195)">
      <!-- Head Mask Base -->
      <ellipse cx="0" cy="0" rx="28" ry="32" fill="url(#suitRed)"/>

      <!-- Mask Web Grid -->
      <path d="M 0 -32 L 0 32" stroke="#881337" stroke-width="1.2"/>
      <path d="M -28 0 L 28 0" stroke="#881337" stroke-width="1.2"/>
      <path d="M -20 -22 L 20 22" stroke="#881337" stroke-width="1"/>
      <path d="M -20 22 L 20 -22" stroke="#881337" stroke-width="1"/>
      <!-- Web Rings -->
      <ellipse cx="0" cy="0" rx="10" ry="12" fill="none" stroke="#881337" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="20" ry="24" fill="none" stroke="#881337" stroke-width="1.2"/>

      <!-- Expressive Iconic White Eyes / Lenses with Black Borders -->
      <!-- Left Eye -->
      <path d="M -5 -6 Q -18 -8 -22 6 Q -14 16 -4 8 Z" fill="#ffffff" stroke="#09090b" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Right Eye -->
      <path d="M 5 -6 Q 18 -8 22 6 Q 14 16 4 8 Z" fill="#ffffff" stroke="#09090b" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Soft Cozy Glint in Lenses -->
      <ellipse cx="-12" cy="1" rx="3" ry="4" fill="#38bdf8" opacity="0.35"/>
      <ellipse cx="12" cy="1" rx="3" ry="4" fill="#38bdf8" opacity="0.35"/>
    </g>
  </g>

  <!-- Little Cozy Sparkles -->
  <path d="M 40 180 Q 40 186 46 186 Q 40 186 40 192 Q 40 186 34 186 Q 40 186 40 180 Z" fill="#fbbf24"/>
  <circle cx="165" cy="120" r="2.5" fill="#38bdf8"/>
  <circle cx="48" cy="130" r="1.8" fill="#ffffff"/>
</svg>
