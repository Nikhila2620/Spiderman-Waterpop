<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49258"/>
      <stop offset="100%" stop-color="#be7a40"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="50%" stop-color="#333" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Blue Mild Disappointment Glow -->
  <circle cx="100" cy="110" r="90" fill="#64748b" opacity="0.15"/>

  <!-- Iconic Fluffy Hairstyle (Back) -->
  <path d="M 50 100 C 30 70, 35 25, 75 20 C 95 10, 125 10, 145 25 C 175 35, 175 75, 155 105 C 165 75, 160 40, 135 30 C 115 22, 85 24, 65 40 C 50 55, 48 80, 50 100 Z" fill="url(#hairGrad)" filter="url(#shadow)"/>
  
  <!-- Sideburns -->
  <path d="M 45 95 C 40 80, 42 60, 52 48 C 40 68, 44 95, 52 110 Z" fill="#222"/>
  <path d="M 155 95 C 160 80, 158 60, 148 48 C 160 68, 156 95, 148 110 Z" fill="#222"/>

  <!-- Neck & Shirt -->
  <path d="M 85 125 L 115 125 L 120 155 L 80 155 Z" fill="url(#skinGrad)"/>
  <path d="M 50 195 C 50 160, 75 145, 88 145 L 100 168 L 112 145 C 125 145, 150 160, 150 195 Z" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Jacket Collar -->
  <path d="M 46 195 C 48 162, 70 148, 80 148 L 76 170 C 65 174, 54 184, 46 195 Z" fill="#18181b"/>
  <path d="M 154 195 C 152 162, 130 148, 120 148 L 124 170 C 135 174, 146 184, 154 195 Z" fill="#18181b"/>
  <!-- Gold Chain -->
  <path d="M 90 155 Q 100 170, 110 155" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Face Contour (Slight Head Tilt) -->
  <path d="M 62 84 C 60 117, 75 140, 100 140 C 125 140, 140 117, 138 84 C 138 62, 128 52, 100 52 C 72 52, 62 62, 62 84 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="60" cy="92" rx="5" ry="9" fill="#be7a40"/>
  <ellipse cx="140" cy="92" rx="5" ry="9" fill="#be7a40"/>

  <!-- Hair Front Puff -->
  <path d="M 58 57 C 50 37, 75 20, 100 22 C 130 20, 155 37, 145 57 C 138 40, 118 32, 100 34 C 80 32, 65 42, 58 57 Z" fill="#1e1e1e"/>

  <!-- Expressive Raised Eyebrows (Questioning "Enna da idhu?") -->
  <path d="M 72 70 Q 82 62 94 69" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <path d="M 106 69 Q 118 64 128 72" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>

  <!-- Wide Eyes Peeking Over Sunglasses -->
  <ellipse cx="82" cy="79" rx="6" ry="7" fill="#ffffff"/>
  <circle cx="83" cy="79" r="3.5" fill="#111827"/>
  <circle cx="84.5" cy="77.5" r="1.2" fill="#ffffff"/>

  <ellipse cx="118" cy="79" rx="6" ry="7" fill="#ffffff"/>
  <circle cx="117" cy="79" r="3.5" fill="#111827"/>
  <circle cx="118.5" cy="77.5" r="1.2" fill="#ffffff"/>

  <!-- Sunglasses Slid Down Nose -->
  <g transform="translate(0, 12)" filter="url(#shadow)">
    <path d="M 96 82 L 104 82" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 68 76 L 96 76 C 96 88, 92 98, 80 98 C 69 98, 68 88, 68 76 Z" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 104 76 L 132 76 C 132 88, 131 98, 120 98 C 108 98, 104 88, 104 76 Z" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 72 79 L 82 79 L 75 92 L 71 92 Z" fill="#ffffff" opacity="0.35"/>
    <path d="M 108 79 L 118 79 L 111 92 L 107 92 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Big Anime-style Blue Sweat Drop (Right temple) -->
  <g transform="translate(138, 48)">
    <path d="M 8 0 C 8 0, 16 12, 16 18 C 16 23, 12.4 26, 8 26 C 3.6 26, 0 23, 0 18 C 0 12, 8 0, 8 0 Z" fill="#38bdf8" opacity="0.9" filter="url(#shadow)"/>
    <ellipse cx="6" cy="18" rx="2" ry="4" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Comedic Disappointed Mouth -->
  <path d="M 88 126 Q 100 120, 112 126" fill="none" stroke="#683416" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mustache -->
  <path d="M 88 121 Q 100 118, 112 121 Q 100 124, 88 121 Z" fill="#222"/>

  <!-- Questioning Hand (Palm Tilted in "Enna Paa?" gesture) -->
  <g transform="translate(142, 125)" filter="url(#shadow)">
    <!-- Palm up fingers -->
    <path d="M 6 12 C 10 8, 18 10, 22 16 C 26 22, 22 32, 14 36 L 6 30 Z" fill="#d49258"/>
    <circle cx="16" cy="18" r="4" fill="#be7a40"/>
  </g>

  <!-- Comedic question marks / sweat tick -->
  <text x="32" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8">?</text>
  <text x="24" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#cbd5e1">?!</text>
</svg>
