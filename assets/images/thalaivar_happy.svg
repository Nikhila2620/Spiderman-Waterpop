<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49258"/>
      <stop offset="100%" stop-color="#be7a40"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="50%" stop-color="#333" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Golden Celebration Aura & Stars -->
  <circle cx="100" cy="110" r="95" fill="#f59e0b" opacity="0.22"/>
  
  <!-- Sparkle Stars -->
  <!-- Star 1 (Top Right) -->
  <path d="M 170 30 Q 170 40 180 40 Q 170 40 170 50 Q 170 40 160 40 Q 170 40 170 30 Z" fill="#fbbf24"/>
  <!-- Star 2 (Top Left) -->
  <path d="M 30 45 Q 30 53 38 53 Q 30 53 30 61 Q 30 53 22 53 Q 30 53 30 45 Z" fill="#38bdf8"/>
  <!-- Star 3 (Right Mid) -->
  <path d="M 180 100 Q 180 106 186 106 Q 180 106 180 112 Q 180 106 174 106 Q 180 106 180 100 Z" fill="#fbbf24"/>
  <!-- Confetti bits -->
  <circle cx="45" cy="25" r="3.5" fill="#ec4899"/>
  <circle cx="155" cy="18" r="4" fill="#38bdf8"/>
  <rect x="25" y="115" width="6" height="6" rx="1.5" fill="#f59e0b" transform="rotate(25 28 118)"/>
  <rect x="175" y="145" width="7" height="7" rx="2" fill="#10b981" transform="rotate(40 178 148)"/>

  <!-- Iconic Fluffy Hairstyle (Back) -->
  <path d="M 50 100 C 30 70, 35 25, 75 20 C 95 10, 125 10, 145 25 C 175 35, 175 75, 155 105 C 165 75, 160 40, 135 30 C 115 22, 85 24, 65 40 C 50 55, 48 80, 50 100 Z" fill="url(#hairGrad)" filter="url(#shadow)"/>
  
  <!-- Sideburns & Mane -->
  <path d="M 45 95 C 40 80, 42 60, 52 48 C 40 68, 44 95, 52 110 C 48 105, 45 100, 45 95 Z" fill="#222"/>
  <path d="M 155 95 C 160 80, 158 60, 148 48 C 160 68, 156 95, 148 110 C 152 105, 155 100, 155 95 Z" fill="#222"/>

  <!-- Neck & White Collar Shirt -->
  <path d="M 85 125 L 115 125 L 120 155 L 80 155 Z" fill="url(#skinGrad)"/>
  <!-- White Silk Shirt / Kurta -->
  <path d="M 50 195 C 50 160, 75 145, 88 145 L 100 168 L 112 145 C 125 145, 150 160, 150 195 Z" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Dark Open Jacket -->
  <path d="M 46 195 C 48 162, 70 148, 80 148 L 76 170 C 65 174, 54 184, 46 195 Z" fill="#18181b"/>
  <path d="M 154 195 C 152 162, 130 148, 120 148 L 124 170 C 135 174, 146 184, 154 195 Z" fill="#18181b"/>
  <!-- Gold Chain -->
  <path d="M 90 155 Q 100 170, 110 155" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Face Contour -->
  <path d="M 62 82 C 60 115, 75 138, 100 138 C 125 138, 140 115, 138 82 C 138 60, 128 50, 100 50 C 72 50, 62 60, 62 82 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="60" cy="90" rx="5" ry="9" fill="#be7a40"/>
  <ellipse cx="140" cy="90" rx="5" ry="9" fill="#be7a40"/>

  <!-- Signature Hair Front Puff -->
  <path d="M 58 55 C 50 35, 75 18, 100 20 C 130 18, 155 35, 145 55 C 138 38, 118 30, 100 32 C 80 30, 65 40, 58 55 Z" fill="#1e1e1e"/>

  <!-- Smiling Cheerful Eyes (Sunglasses Pushed Up with Swagger) -->
  <!-- Happy Crescent Eyes -->
  <path d="M 74 85 Q 84 76 94 85" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <path d="M 106 85 Q 116 76 126 85" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>

  <!-- Sunglasses Tilted Up On Forehead / Hair -->
  <g transform="translate(0, -22)" filter="url(#shadow)">
    <path d="M 96 72 L 104 72" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 68 66 L 96 66 C 96 78, 92 86, 80 86 C 69 86, 68 78, 68 66 Z" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 104 66 L 132 66 C 132 78, 131 86, 120 86 C 108 86, 104 78, 104 66 Z" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 72 68 L 82 68 L 75 80 L 71 80 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 108 68 L 118 68 L 111 80 L 107 80 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Big Winning Smile & Teeth -->
  <path d="M 82 114 Q 100 134, 118 114 Z" fill="#ffffff" stroke="#683416" stroke-width="2"/>
  <!-- Mustache -->
  <path d="M 86 112 Q 100 110, 114 112 Q 100 116, 86 112 Z" fill="#222"/>

  <!-- Thumbs Up Hand (Right Side) -->
  <g transform="translate(142, 110)" filter="url(#shadow)">
    <!-- Thumb pointing up -->
    <path d="M 16 10 C 13 10, 12 16, 12 24 L 12 36 L 24 36 L 24 24 C 24 16, 21 10, 16 10 Z" fill="#d49258"/>
    <!-- Curled fingers fist -->
    <rect x="4" y="24" width="22" height="24" rx="8" fill="#be7a40"/>
    <line x1="8" y1="30" x2="20" y2="30" stroke="#a16207" stroke-width="1.5"/>
    <line x1="8" y1="36" x2="20" y2="36" stroke="#a16207" stroke-width="1.5"/>
    <line x1="8" y1="42" x2="20" y2="42" stroke="#a16207" stroke-width="1.5"/>
  </g>

  <!-- Giant Glint / Twinkle on Thumbs up -->
  <path d="M 158 12 Q 158 20 166 20 Q 158 20 158 28 Q 158 20 150 20 Q 158 20 158 12 Z" fill="#ffffff"/>
</svg>
