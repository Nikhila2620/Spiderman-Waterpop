<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49258"/>
      <stop offset="100%" stop-color="#be7a40"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="50%" stop-color="#333" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="100" cy="110" r="90" fill="#f59e0b" opacity="0.12"/>

  <!-- Iconic Fluffy Hairstyle (Back) -->
  <path d="M 50 100 C 30 70, 35 25, 75 20 C 95 10, 125 10, 145 25 C 175 35, 175 75, 155 105 C 165 75, 160 40, 135 30 C 115 22, 85 24, 65 40 C 50 55, 48 80, 50 100 Z" fill="url(#hairGrad)" filter="url(#shadow)"/>
  
  <!-- Sideburns & Mane -->
  <path d="M 45 95 C 40 80, 42 60, 52 48 C 40 68, 44 95, 52 110 C 48 105, 45 100, 45 95 Z" fill="#222"/>
  <path d="M 155 95 C 160 80, 158 60, 148 48 C 160 68, 156 95, 148 110 C 152 105, 155 100, 155 95 Z" fill="#222"/>

  <!-- Neck & White Collar Shirt -->
  <path d="M 85 125 L 115 125 L 120 155 L 80 155 Z" fill="url(#skinGrad)"/>
  <!-- Jacket / Shirt -->
  <path d="M 50 195 C 50 160, 75 145, 88 145 L 100 168 L 112 145 C 125 145, 150 160, 150 195 Z" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Upturned Stylish Dark Jacket Collar -->
  <path d="M 46 195 C 48 162, 70 148, 80 148 L 76 170 C 65 174, 54 184, 46 195 Z" fill="#18181b"/>
  <path d="M 154 195 C 152 162, 130 148, 120 148 L 124 170 C 135 174, 146 184, 154 195 Z" fill="#18181b"/>
  <!-- Gold Chain -->
  <path d="M 90 155 Q 100 170, 110 155" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Face Contour -->
  <path d="M 62 82 C 60 115, 75 138, 100 138 C 125 138, 140 115, 138 82 C 138 60, 128 50, 100 50 C 72 50, 62 60, 62 82 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="60" cy="90" rx="5" ry="9" fill="#be7a40"/>
  <ellipse cx="140" cy="90" rx="5" ry="9" fill="#be7a40"/>

  <!-- Signature Voluminous Front Hair Puff -->
  <path d="M 58 55 C 50 35, 75 18, 100 20 C 130 18, 155 35, 145 55 C 138 38, 118 30, 100 32 C 80 30, 65 40, 58 55 Z" fill="#1e1e1e"/>
  <path d="M 72 32 C 85 25, 110 25, 125 32 C 115 28, 90 28, 72 32 Z" fill="#444"/>

  <!-- Signature Mustache / Stubble -->
  <path d="M 88 116 Q 100 114, 112 116 Q 100 120, 88 116 Z" fill="#222"/>
  <path d="M 96 123 Q 100 125, 104 123" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Trademark Confident Smirk -->
  <path d="M 90 124 Q 100 129, 112 125" fill="none" stroke="#683416" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Iconic Black Sunglasses (Rajini Wayfarer Style) -->
  <g filter="url(#shadow)">
    <!-- Bridge -->
    <path d="M 96 82 L 104 82" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Rim & Glass -->
    <path d="M 68 76 L 96 76 C 96 88, 92 98, 80 98 C 69 98, 68 88, 68 76 Z" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2"/>
    <!-- Right Rim & Glass -->
    <path d="M 104 76 L 132 76 C 132 88, 131 98, 120 98 C 108 98, 104 88, 104 76 Z" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2"/>
    <!-- Glass Highlights / Sheen -->
    <path d="M 72 79 L 82 79 L 75 92 L 71 92 Z" fill="#ffffff" opacity="0.35"/>
    <path d="M 108 79 L 118 79 L 111 92 L 107 92 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Water Glass in Hand (Right Side) -->
  <g transform="translate(142, 120)" filter="url(#shadow)">
    <!-- Tumbler glass -->
    <path d="M 4 8 L 28 8 L 24 45 L 8 45 Z" fill="#e0f2fe" opacity="0.55" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Water Inside -->
    <path d="M 6 18 L 26 18 L 23 43 L 9 43 Z" fill="url(#waterGrad)" opacity="0.85"/>
    <!-- Bubbles & Sparkle in Water -->
    <circle cx="16" cy="28" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="12" cy="35" r="1.5" fill="#ffffff" opacity="0.6"/>
    <!-- Hand holding glass -->
    <path d="M 2 24 C 6 22, 10 24, 10 28 C 10 32, 6 34, 2 34 Z" fill="#be7a40"/>
    <path d="M 2 33 C 6 32, 10 34, 10 38 C 10 42, 6 44, 2 44 Z" fill="#be7a40"/>
  </g>

  <!-- Little Droplets near glass -->
  <path d="M 158 112 C 158 110, 162 106, 162 106 C 162 106, 166 110, 166 112 C 166 114, 163 116, 161 116 C 159 116, 158 114, 158 112 Z" fill="#38bdf8"/>
</svg>
